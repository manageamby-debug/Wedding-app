[project]
name = "chereko-api"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi",
    "sqlalchemy",
    "email-validator",
    "PyJWT",
    "pwdlib[argon2]",
    "python-dotenv",
    "python-multipart",
    "psycopg2-binary",
    "psycopg[binary]",
]

[tool.vercel]
entrypoint = "app.main:app"
